name: Pull Request Workflow

on:
  pull_request:
    branches:
      - master

jobs:
  check_formatting:
    uses: NWChemEx/.github/.github/workflows/check_formatting.yaml@master

  test_nwx_docs:
    uses: NWChemEx/.github/.github/workflows/test_nwx_docs.yaml@master
    with:
      doc_target: "scf_cxx_api"

  # allow_macos_failure: SCF has a known, tracked, macOS-only segfault (see
  # scf-macos-pybind11-segfault.md). macOS still runs and reports its real
  # result -- visible signal for the investigation -- but doesn't block this
  # workflow or PR merge readiness. Drop once the segfault is fixed.
  test_cmake_build:
    # TEMPORARY: pinned to a diagnostics branch to capture a PyErr_Format
    # breakpoint probe for the macOS segfault (see
    # scf-macos-pybind11-segfault.md). Revert to @master once the probe
    # data is captured -- this branch/PR is throwaway, nothing here merges.
    uses: NWChemEx/.github/.github/workflows/test_nwx_cmake_build.yaml@macos-crash-diagnostics
    with:
      run_python_tests: "true"
      cmake_opts: "-DINTEGRATION_TESTING=ON"
      python_version: "3.12"
      extra_pip_packages: "nwchemex --extra-index-url https://test.pypi.org/simple/"
      allow_macos_failure: "true"

  test_pip_build:
    uses: NWChemEx/.github/.github/workflows/test_nwx_pip_build.yaml@master
    with:
      allow_macos_failure: "true"
