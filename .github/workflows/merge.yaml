name: Merge Workflow

on:
  push:
    branches:
      - master

jobs:
  tag-commit:
    uses: NWChemEx/.github/.github/workflows/tag.yaml@master
    secrets: inherit

  deploy_nwx_docs:
    uses: NWChemEx/.github/.github/workflows/deploy_nwx_docs.yaml@master
    with:
      doc_target: "scf_cxx_api"
      generate_module_docs: true
    secrets: inherit

  platform_matrix:
    uses: NWChemEx/.github/.github/workflows/platform_matrix.yaml@master

  # SCF has a known, tracked, macOS-only segfault (see
  # scf-macos-pybind11-segfault.md) -- skip publishing a macOS wheel until
  # it's fixed, rather than ship a broken one. Filters platform_matrix's
  # release_matrix down to ubuntu-latest only; drop this job and go back to
  # consuming platform_matrix.outputs.release_matrix directly once macOS is
  # re-enabled.
  filter_release_matrix:
    needs: platform_matrix
    runs-on: ubuntu-latest
    outputs:
      release_matrix: ${{ steps.filter.outputs.release_matrix }}
    steps:
      - id: filter
        shell: bash
        run: |
          filtered=$(echo '${{ needs.platform_matrix.outputs.release_matrix }}' \
            | jq -c '[.[] | select(.os != "macos-14")]')
          echo "release_matrix=$filtered" >> "$GITHUB_OUTPUT"

  build_pypi_dist:
    needs: [tag-commit, filter_release_matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.filter_release_matrix.outputs.release_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Build PyPI Distribution
        uses: NWChemEx/.github/.github/actions/build_pypi_dist@master
        with:
          cibw_build: ${{ matrix.cibw_build }}
          build_sdist: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
          needs_mpi: "true"
          needs_boost: "true"
          needs_blas: "true"
          needs_openmp: "true"

      - name: Upload Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  # A separate, ubuntu-only publish job (rather than a publish step per
  # build_pypi_dist leg) because pypa/gh-action-pypi-publish only runs on
  # Linux, and because PyPI trusted publishing does not support reusable
  # workflows (this job must be defined directly here, not delegated).
  deploy_to_pypi:
    needs: build_pypi_dist
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download All Distributions
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
