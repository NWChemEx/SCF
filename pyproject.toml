[build-system]
requires = [
    "scikit-build-core>=0.10",
    "setuptools-scm>=8",
    # gau2grid (fetched transitively via GauXC) invokes a Python codegen
    # script at CMake configure/build time that imports numpy -- needed in
    # the isolated build env even though scikit-build-core's build-system
    # deps are otherwise C++-only. Capped below 2 on Linux only: newer numpy
    # releases only ship manylinux2014 wheels for a GCC >= 10.3 build, and
    # manylinux2014's own GCC 10.2.1 can't build numpy from source either, so
    # an unpinned requirement falls back to a source build that fails
    # outright there. This cap only affects the isolated build env, not the
    # runtime numpy version a user ends up with (see requirements.txt for
    # that). macOS has no such manylinux/GCC-ABI constraint -- its wheel tags
    # are keyed on the deployment target, not the build GCC -- so leaving it
    # unpinned there lets pip resolve a real numpy>=2 wheel for whatever
    # Python is active (e.g. cp314), instead of falling back to a numpy<2
    # source build that has no cp314 wheel and fails distinctly: Homebrew's
    # gcc-14 has no bundled linker, so it shells out to Apple's system ld,
    # and meson's linker-detection probe (`gcc-14 -Wl,--version`) fails
    # against it ("ld: unknown options: --version") on current macOS/Xcode.
    "numpy<2 ; sys_platform == 'linux'",
    "numpy ; sys_platform != 'linux'",
    # Ecosystem packages this build resolves from installed wheels rather
    # than fetching from git master, so the wheel links against exactly the
    # binaries users get at runtime and ships only its own files. Mirror
    # [project].dependencies; leave the floors unbounded so the newest
    # release is always resolved.
    "nwchemex-nwxcmake>=0.1.0",
    "nwchemex-simde>=0.0.77",
]
build-backend = "scikit_build_core.build"

[project]
name = "nwchemex-scf"
dynamic = ["version"]
description = "Self-consistent field (SCF) methods for the NWChemEx ecosystem"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
dependencies = [
    # Must match NWXCMake cmake/dependencies/pybind11.cmake GIT_TAG: a
    # different PYBIND11_INTERNALS_VERSION gives extensions separate type
    # registries and breaks cross-module type exchange.
    "pybind11==3.1.0",
    "nwchemex-nwxcmake>=0.1.0",
    "nwchemex-simde>=0.0.77",
]

[project.optional-dependencies]
# The integration tests run SCF's modules with the plugins they are wired to
# (see scf::set_defaults). None of these depends on scf, so installing them
# never pulls in a published copy of the package under test.
dev = [
    "pytest",
    "pre-commit",
    "nwchemex-integrals",
    "nwchemex-chemcache",
    "nwchemex-nux",
]

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
# All installed content comes from the CMake install; no pure-Python packages.
wheel.packages = []
# Ship only this project's own install rules ("scf") plus third-party
# dependencies this build had to fetch itself ("Unspecified", CMake's default
# component). Ecosystem dependencies are resolved from their own wheels, and
# their files belong to those wheels.
install.components = ["scf", "Unspecified"]
build-dir = "build"

[tool.setuptools_scm]
fallback_version = "0.0.0"

# For editable (developer) installs, also build the tests.
[[tool.scikit-build.overrides]]
if.state = "editable"
cmake.args = ["-DDEVELOPER_SETUP=ON"]
